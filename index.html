<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="إدارة بيانات العملاء بسهولة"><title>سجلات العملاء</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--primary:#2563eb;--danger:#dc2626;--shadow:0 8px 25px rgba(16,24,40,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#0f172a;--card:#182235;--text:#f8fafc;--muted:#aab4c5;--line:#2c394d;--shadow:0 8px 25px rgba(0,0,0,.25)}
.container{max-width:1100px;margin:auto;padding:22px}header{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap}h1{margin:0 0 5px;font-size:30px}header p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}
button,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.danger{background:var(--danger);color:#fff}
.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:0}.top{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:18px}.count{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;white-space:nowrap}#status{min-height:24px;color:var(--muted);margin:10px 0}.error{color:var(--danger)!important}.success{color:#16a34a!important}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.card h3{margin:0 0 12px;font-size:19px}.info{margin:8px 0;color:var(--muted);word-break:break-word}.info strong{color:var(--text)}.card a{color:var(--primary);text-decoration:none}.card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.empty{text-align:center;padding:45px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px}.pagination{display:flex;justify-content:center;gap:8px;margin:22px 0;flex-wrap:wrap}.pagination button.active{background:var(--primary);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}.dialog{width:min(520px,100%);background:var(--card);border-radius:18px;padding:20px}.dialog h2{margin-top:0}label{display:block;margin:12px 0 6px;font-weight:700}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);outline:0}textarea{min-height:90px;resize:vertical}.form-actions{display:flex;gap:8px;margin-top:17px;justify-content:flex-start}@media(max-width:650px){.container{padding:14px}h1{font-size:25px}.top{grid-template-columns:1fr}.count{text-align:center}.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="container"><header><div><h1>سجلات العملاء</h1><p>إدارة بيانات العملاء بسهولة</p></div><div class="actions"><button class="secondary" id="themeBtn">🌙 الوضع الليلي</button><button class="primary" id="addBtn">＋ إضافة عميل</button></div></header>
<div class="top"><input class="search" id="search" placeholder="ابحث بالاسم أو رقم الهاتف..."><div class="count">عدد العملاء: <strong id="count">0</strong></div></div><div id="status">جاري تحميل العملاء...</div><div id="list" class="grid"></div><div id="pagination" class="pagination"></div></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">إضافة عميل</h2><form id="form"><input type="hidden" id="customerId"><label>الاسم *</label><input id="name" required maxlength="120"><label>رقم الهاتف *</label><input id="phone" required maxlength="40" inputmode="tel"><label>رابط Google Maps</label><input id="location" type="url" placeholder="https://maps.google.com/..."><label>ملاحظات</label><textarea id="notes" maxlength="1000"></textarea><div class="form-actions"><button class="primary" type="submit">حفظ</button><button class="secondary" type="button" id="cancelBtn">إلغاء</button></div></form></div></div>
<script>
const API="https://wbtblvjwtuzmhfngnosu.supabase.co/functions/v1/customer-records";const state={customers:[],page:1,perPage:10,editing:null};const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function status(m,t=""){$("status").textContent=m;$("status").className=t}async function api(path="",o={}){const r=await fetch(API+path,{...o,headers:{"Content-Type":"application/json",...(o.headers||{})}});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.error||d?.message||`HTTP ${r.status}`);return d}
function filtered(){const q=$("search").value.trim().toLowerCase();return state.customers.filter(c=>!q||String(c.name||"").toLowerCase().includes(q)||String(c.phone||"").toLowerCase().includes(q))}
function render(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/state.perPage));if(state.page>pages)state.page=pages;const pageRows=rows.slice((state.page-1)*state.perPage,state.page*state.perPage);$("count").textContent=state.customers.length;$("list").innerHTML=pageRows.length?pageRows.map(c=>`<article class="card"><h3>${esc(c.name)}</h3><div class="info">📞 <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>${c.location?`<div class="info">📍 <a href="${esc(c.location)}" target="_blank" rel="noopener">فتح الموقع على الخريطة</a></div>`:""}${c.notes?`<div class="info">📝 <strong>ملاحظات:</strong> ${esc(c.notes)}</div>`:""}<div class="card-actions"><button class="secondary" onclick="editCustomer('${esc(c.id)}')">تعديل</button><button class="danger" onclick="deleteCustomer('${esc(c.id)}')">حذف</button></div></article>`).join(""):`<div class="empty" style="grid-column:1/-1">لا توجد نتائج.</div>`;$("pagination").innerHTML=Array.from({length:pages},(_,i)=>`<button class="${i+1===state.page?'active':''} secondary" onclick="goPage(${i+1})">${i+1}</button>`).join("")}
function goPage(n){state.page=n;render();scrollTo({top:0,behavior:"smooth"})}async function load(){try{status("جاري تحميل العملاء...");const d=await api();state.customers=Array.isArray(d)?d:(d?.customers||[]);render();status("تم تحميل سجلات العملاء","success")}catch(e){status("تعذر تحميل العملاء: "+e.message,"error");$("list").innerHTML='<div class="empty" style="grid-column:1/-1">حدث خطأ في الاتصال بالخادم.</div>'}}
function openModal(c=null){state.editing=c?.id||null;$("modalTitle").textContent=c?"تعديل عميل":"إضافة عميل";$("name").value=c?.name||"";$("phone").value=c?.phone||"";$("location").value=c?.location||"";$("notes").value=c?.notes||"";$("modal").classList.add("open");setTimeout(()=>$("name").focus(),50)}function closeModal(){$("modal").classList.remove("open")}function editCustomer(id){const c=state.customers.find(x=>String(x.id)===String(id));if(c)openModal(c)}
async function deleteCustomer(id){const c=state.customers.find(x=>String(x.id)===String(id));if(!c||!confirm(`هل تريد حذف العميل "${c.name}"؟`))return;try{status("جاري الحذف...");await api("/"+encodeURIComponent(id),{method:"DELETE"});state.customers=state.customers.filter(x=>String(x.id)!==String(id));render();status("تم حذف العميل","success")}catch(e){status("تعذر الحذف: "+e.message,"error")}}
$("form").addEventListener("submit",async e=>{e.preventDefault();const p={name:$("name").value.trim(),phone:$("phone").value.trim(),location:$("location").value.trim()||null,notes:$("notes").value.trim()||null};if(!p.name||!p.phone)return;try{status("جاري الحفظ...");if(state.editing){const d=await api("/"+encodeURIComponent(state.editing),{method:"PATCH",body:JSON.stringify(p)});const item=d?.customer||d,i=state.customers.findIndex(x=>String(x.id)===String(state.editing));if(i>=0)state.customers[i]=item}else{const d=await api("",{method:"POST",body:JSON.stringify(p)});state.customers.unshift(d?.customer||d)}closeModal();render();status("تم حفظ بيانات العميل","success")}catch(e){status("تعذر الحفظ: "+e.message,"error")}});
$("addBtn").onclick=()=>openModal();$("cancelBtn").onclick=closeModal;$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};$("search").oninput=()=>{state.page=1;render()};$("themeBtn").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("dark",document.body.classList.contains("dark"));$("themeBtn").textContent=document.body.classList.contains("dark")?"☀️ الوضع النهاري":"🌙 الوضع الليلي"};if(localStorage.getItem("dark")==="true")$("themeBtn").click();load();
</script></body></html>
